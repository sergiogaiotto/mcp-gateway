# Um SeaweedFS de um nó (master, volume, filer e S3 num processo só) para o kind. Os
# artefatos do RaPA vão para o bucket rapa-artefatos pelo S3; o teste confere os objetos pelo
# filer (seaweedfs-filer:8888). As chaves do S3 vêm do Secret seaweedfs-s3, que
# deploy/kind/instalar.sh cria com valores aleatórios.
apiVersion: v1
kind: Namespace
metadata:
  name: armazenamento
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: armazenamento
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      automountServiceAccountToken: false
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args:
            - server
            - -dir=/data
            - -ip=$(POD_IP)
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB=64
            - -volume.max=20
            - -filer
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: master
              containerPort: 9333
            - name: filer
              containerPort: 8888
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          secret:
            secretName: seaweedfs-s3
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: armazenamento
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-filer
  namespace: armazenamento
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: filer
      port: 8888
      targetPort: filer
