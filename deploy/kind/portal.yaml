# O portal de teste (rapa.fixtures.portal) no kind, servido pela imagem de controle. O CoreDNS
# do kind resolve portal.rapa.test para este Service (deploy/kind/instalar.sh).
apiVersion: v1
kind: Namespace
metadata:
  name: rapa-teste
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: rapa-teste
  labels:
    app.kubernetes.io/name: portal-de-teste
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-de-teste
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-de-teste
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: rapa-controle:ci
          imagePullPolicy: Never
          args:
            - python
            - -m
            - uvicorn
            - --factory
            - rapa.fixtures.portal:create_app
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /login
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: rapa-teste
spec:
  selector:
    app.kubernetes.io/name: portal-de-teste
  ports:
    - name: http
      port: 8080
      targetPort: http
